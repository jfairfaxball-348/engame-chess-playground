name: Playground checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      # Check exact frozen Lean proofs and theorem versions at their immutable SHA.
      # This validates provenance, not an unimplemented global KRK algorithm.
      - run: npm run verify:krk-sources
      # Pure diagnostic: geometric premise coverage, not an engine/tablebase.
      - run: npm run audit:krk-phase-domains
      # Exhaustively check every legal fresh strong-turn root. This checks actual
      # selector availability, never replaces Lean all-defender mate proof.
      - run: npm run audit:krk-root-selector -- --all --strict
      # KRK14 falsification: test actual first/second weak replies and weak-to-move
      # root partitions. Record failures, but do not claim global mate proof.
      - run: npm run audit:krk14-continuations -- --limit=2048
      # Bounded all-defender game tree on one source-wall root; no fallback.
      - run: npm run audit:krk14-mate-tree -- --nodes=40000
      # S022: do not rely solely on the one KRK wall-root test. Falsify
      # all weak replies for 24 source/colour/frame seeds; report caps
      # separately and retain every source-derived move restriction.
      - run: node scripts/krk15-stratified-mate-audit.mjs --nodes=1000 --plies=160 --examples=6
      # S023 second diagnostic tier: larger deterministic all-defender
      # budgets help separate state-space explosion from source gaps.
      # Non-strict, explicitly NOT a global mate certification.
      - run: node scripts/krk15-stratified-mate-audit.mjs --nodes=2500 --plies=160 --examples=6
      # Diagnostic only: bounded KQK legal roots, all immediate replies and complete fixed lines.
      - run: npm run audit:kqk-roots
      # S021: stratified all-defender continuation falsification. Bounded
      # evidence only; unlike the deterministic-first-reply audit it explores
      # every legal weak response until the explicit node/depth caps.
      - run: npm run audit:kqk-adversarial
      # S023: wider KQK family sampling and deeper capped trees.
      # A cap remains inconclusive even if no hard counterexample appears.
      - run: npm run audit:kqk-adversarial -- --attempts=12000 --per-family=4 --nodes=2500 --rounds=64
      # S027 reference: SAME fixed-seed roots, no cross-depth cache reuse.
      # Compare to default monotone results; both are diagnostic, never proof.
      - run: npm run audit:kqk-adversarial -- --attempts=12000 --per-family=4 --nodes=2500 --rounds=64 --cache=exact
      - run: npm run check
      - run: npm run build
      # Provider-independent Cloudflare Pages handoff: ensure the deployable
      # static output includes both browser engines and the Maths entrypoint.
      - run: node scripts/verify-pages-output.mjs
      # Playwright is CI-only; the new arena has pinned browser-only dependencies.
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-qa.mjs
      - run: node scripts/arena-browser-qa.mjs

      # Report the completed test job to the commit's public status API. This
      # makes browser QA visible without confusing Vercel deployment with CI.
      - name: Publish Node and Chromium QA status
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'EOF'
          const state = process.env.CHECK_RESULT === 'success' ? 'success' : 'failure';
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28'
            },
            body: JSON.stringify({
              state,
              context: 'Playground Node + Chromium QA',
              description: state === 'success' ? 'Unit tests, syntax, build and Chromium browser QA passed' : 'One or more Node/Chromium QA steps failed',
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            })
          });
          if (!response.ok) throw Error(`Cannot publish CI status: ${response.status} ${await response.text()}`);
          EOF
